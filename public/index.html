:root {
  /* ============================================================
     COLOR TOKENS
     Sampled from the official CAAT wordmark.
     Sky-aviation palette: deep institutional blue, vivid leaf
     green (the "sustainability" accent from the logo swoosh),
     plus a soft cloud-grey neutral ramp.
     ============================================================ */

  /* Brand — Blue (primary, derived from the CAAT wordmark) */
  --caat-blue-50:  #eaf2f8;
  --caat-blue-100: #cfe0ec;
  --caat-blue-200: #9fc0d9;
  --caat-blue-300: #6fa1c6;
  --caat-blue-400: #4082b3;
  --caat-blue-500: #236595; /* ← brand primary */
  --caat-blue-600: #1e587f;
  --caat-blue-700: #184868;
  --caat-blue-800: #133852;
  --caat-blue-900: #0d2538;

  /* Brand — Green (accent, the airplane swoosh — "sustainability") */
  --caat-green-50:  #f1f9e4;
  --caat-green-100: #ddf0c0;
  --caat-green-200: #c4e597;
  --caat-green-300: #aada6d;
  --caat-green-400: #9ace52;
  --caat-green-500: #8cc73d; /* ← brand accent */
  --caat-green-600: #76a832;
  --caat-green-700: #5e8728;
  --caat-green-800: #46651e;
  --caat-green-900: #2e4314;

  /* Neutrals — cool cloud-grey ramp */
  --neutral-0:   #ffffff;
  --neutral-50:  #f6f8fa;
  --neutral-100: #eef2f6;
  --neutral-200: #dde4eb;
  --neutral-300: #c4cfd9;
  --neutral-400: #9aa7b4;
  --neutral-500: #6e7d8c;
  --neutral-600: #4f5e6d;
  --neutral-700: #364452;
  --neutral-800: #1f2a36;
  --neutral-900: #0f1820;

  /* Semantic — status (aviation-aware) */
  --status-success:    #2f8a4d;
  --status-success-bg: #e6f4ea;
  --status-warning:    #c47c14;   /* amber — caution / alerting */
  --status-warning-bg: #fff4e0;
  --status-danger:     #c0392b;   /* red — critical occurrence */
  --status-danger-bg:  #fde8e6;
  --status-info:       var(--caat-blue-500);
  --status-info-bg:    var(--caat-blue-50);

  /* Severity scale for occurrence reports (ICAO-style) */
  --sev-incident:      #2f8a4d;   /* minor incident */
  --sev-serious:       #c47c14;   /* serious incident */
  --sev-accident:      #c0392b;   /* accident */
  --sev-catastrophic:  #7a1d13;   /* catastrophic */

  /* ============================================================
     SEMANTIC ROLES
     ============================================================ */
  --bg:          var(--neutral-50);
  --bg-elevated: var(--neutral-0);
  --bg-sunken:   var(--neutral-100);
  --bg-brand:    var(--caat-blue-500);
  --bg-brand-soft: var(--caat-blue-50);

  --fg1: var(--neutral-900); /* primary text */
  --fg2: var(--neutral-700); /* secondary text */
  --fg3: var(--neutral-500); /* tertiary / metadata */
  --fg-on-brand: var(--neutral-0);
  --fg-brand: var(--caat-blue-500);
  --fg-accent: var(--caat-green-700);

  --border:        var(--neutral-200);
  --border-strong: var(--neutral-300);
  --border-focus:  var(--caat-blue-500);

  /* Elevation */
  --shadow-xs: 0 1px 2px rgba(15, 24, 32, 0.04);
  --shadow-sm: 0 1px 3px rgba(15, 24, 32, 0.06), 0 1px 2px rgba(15, 24, 32, 0.04);
  --shadow-md: 0 4px 12px rgba(15, 24, 32, 0.07), 0 2px 4px rgba(15, 24, 32, 0.04);
  --shadow-lg: 0 12px 28px rgba(15, 24, 32, 0.10), 0 4px 10px rgba(15, 24, 32, 0.05);
  --shadow-focus: 0 0 0 3px rgba(35, 101, 149, 0.25);

  /* Radii — gentle, civic, not playful */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-xl: 16px;
  --radius-pill: 999px;

  /* Spacing scale (4-px grid) */
  --space-0:  0;
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;

  /* Motion */
  --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --duration-fast: 120ms;
  --duration-base: 200ms;
  --duration-slow: 320ms;

  /* ============================================================
     TYPE TOKENS
     Sarabun is the Thai-government workhorse (royal-decreed
     standard, ships with Thai OS). Strong Thai + Latin coverage.
     ============================================================ */
  --font-sans: "Sarabun", "Noto Sans Thai", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
  --font-display: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;

  /* Sarabun reads small — bump everything ~1 step from Inter defaults */
  --fs-xs:   12px;
  --fs-sm:   14px;
  --fs-base: 16px;
  --fs-md:   18px;
  --fs-lg:   20px;
  --fs-xl:   24px;
  --fs-2xl:  30px;
  --fs-3xl:  36px;
  --fs-4xl:  48px;
  --fs-5xl:  60px;

  --lh-tight:   1.35; /* Thai vowel-marks need more room than Latin */
  --lh-snug:    1.45;
  --lh-base:    1.6;  /* Thai needs more leading than Latin would */
  --lh-relaxed: 1.75;

  --fw-light:    300;
  --fw-regular:  400;
  --fw-medium:   500;
  --fw-semibold: 600;
  --fw-bold:     700;
  --fw-heavy:    800;
}

/* ============================================================
   BASE
   ============================================================ */
html, body {
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  color: var(--fg1);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ============================================================
   SEMANTIC TYPE STYLES
   ============================================================ */
.h1, h1 {
  font-family: var(--font-display);
  font-size: var(--fs-4xl);
  font-weight: var(--fw-bold);
  line-height: 1.3;
  letter-spacing: -0.01em;
  color: var(--fg1);
}
.h2, h2 {
  font-family: var(--font-display);
  font-size: var(--fs-3xl);
  font-weight: var(--fw-bold);
  line-height: 1.3;
  letter-spacing: -0.005em;
  color: var(--fg1);
}
.h3, h3 {
  font-size: var(--fs-2xl);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-snug);
  color: var(--fg1);
}
.h4, h4 {
  font-size: var(--fs-xl);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-snug);
  color: var(--fg1);
}
.h5, h5 {
  font-size: var(--fs-lg);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-snug);
  color: var(--fg1);
}
.eyebrow {
  font-size: var(--fs-xs);
  font-weight: var(--fw-semibold);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-brand);
}
.lede {
  font-size: var(--fs-lg);
  font-weight: var(--fw-regular);
  line-height: var(--lh-relaxed);
  color: var(--fg2);
}
.p, p {
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  color: var(--fg1);
}
.small {
  font-size: var(--fs-sm);
  color: var(--fg2);
}
.meta {
  font-size: var(--fs-xs);
  color: var(--fg3);
  letter-spacing: 0.02em;
}
.mono, code, kbd, samp {
  font-family: var(--font-mono);
  font-size: 0.92em;
}
.label {
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
  color: var(--fg2);
}
</style>
